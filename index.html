<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MicroSpotlight - SM3DW Web Editor</title>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #121316;
      color: #f0f0f0;
    }

    #viewport-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(26, 27, 32, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #ffcc00;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button, .file-btn {
      background: #2b2e38;
      color: #eee;
      border: 1px solid #3d4250;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
    }

    button:hover, .file-btn:hover {
      background: #3b4050;
    }

    button.accent {
      background: #1976d2;
      border-color: #2196f3;
    }

    button.danger {
      background: #d32f2f;
      border-color: #f44336;
      width: 100%;
      margin-top: 10px;
    }

    .file-btn input {
      display: none;
    }

    #inspector {
      position: absolute;
      top: 70px;
      right: 10px;
      width: 260px;
      z-index: 10;
      background: rgba(26, 27, 32, 0.9);
      backdrop-filter: blur(12px);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    #inspector h3 {
      font-size: 13px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }

    #empty-state {
      font-size: 12px;
      color: #777;
      text-align: center;
      padding: 20px 0;
    }

    .hidden {
      display: none;
    }

    fieldset {
      border: 1px solid #333846;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
    }

    legend {
      font-size: 10px;
      color: #889;
      padding: 0 4px;
      text-transform: uppercase;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 11px;
      color: #bbb;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="number"] {
      background: #17181c;
      border: 1px solid #333846;
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 2px;
    }

    .coord-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    @media (max-width: 600px) {
      #inspector {
        top: auto;
        bottom: 10px;
        left: 10px;
        right: 10px;
        width: auto;
        max-height: 40vh;
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>
  <div id="viewport-container"></div>

  <header id="toolbar">
    <div class="brand">⭐ MicroSpotlight</div>
    <div class="actions">
      <button id="btn-add-coin">+ Coin</button>
      <button id="btn-add-goomba">+ Goomba</button>
      <button id="btn-add-block">+ Block</button>
      <button id="btn-add-pipe">+ Pipe</button>
      <button id="btn-export" class="accent">Export JSON</button>
      <label class="file-btn">
        Import JSON
        <input type="file" id="file-import" accept=".json">
      </label>
    </div>
  </header>

  <aside id="inspector">
    <h3>Inspector</h3>
    <div id="empty-state">Tap or click any object in 3D to edit properties.</div>
    <div id="inspector-fields" class="hidden">
      <label>Object Type
        <input type="text" id="prop-name" readonly>
      </label>

      <fieldset>
        <legend>Position (Translate)</legend>
        <div class="coord-row">
          <label>X <input type="number" step="10" id="prop-x"></label>
          <label>Y <input type="number" step="10" id="prop-y"></label>
          <label>Z <input type="number" step="10" id="prop-z"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Rotation (Degrees)</legend>
        <div class="coord-row">
          <label>RX <input type="number" step="15" id="prop-rx"></label>
          <label>RY <input type="number" step="15" id="prop-ry"></label>
          <label>RZ <input type="number" step="15" id="prop-rz"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Scale</legend>
        <div class="coord-row">
          <label>SX <input type="number" step="0.1" id="prop-sx"></label>
          <label>SY <input type="number" step="0.1" id="prop-sy"></label>
          <label>SZ <input type="number" step="0.1" id="prop-sz"></label>
        </div>
      </fieldset>

      <button id="btn-delete" class="danger">Delete Object</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
